<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI PDF Summary</title>

    <link rel="stylesheet"
          href="css/ai-summary.css">

</head>

<body>

<div class="container">

    <h1>🤖 AI PDF Summary</h1>

    <div class="card">

        <label>Select PDF</label>

        <select id="noteSelect"></select>

        <button id="generateBtn">
            Generate Summary
        </button>

    </div>

    <div class="summary-card">

        <h2>Summary</h2>

        <div id="summaryResult">

            Select a PDF and click
            <b>Generate Summary</b>.

        </div>

    </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="js/ai-summary.js"></script>


</body>

</html>
