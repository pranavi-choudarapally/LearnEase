<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | LearnEase</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <h1>LearnEase</h1>

        <h2>Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="loginEmail"
                placeholder="Email">

            <small class="error" id="loginEmailError"></small>

            <input
                type="password"
                id="loginPassword"
                placeholder="Password">

            <small class="error" id="loginPasswordError"></small>

            <button
                type="submit"
                class="btn btn-primary">

                Login

            </button>

            <p id="loginMessage"></p>

        </form>

        <p>

            Don't have an account?

            <a href="signup.html">

                Sign Up

            </a>

        </p>

    </div>

</div>

<script src="js/auth.js"></script>

</body>

</html>
